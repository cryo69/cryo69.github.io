<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forza Kritik – UI Prototype</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --content-bg: #202427;
            --card-bg: #252a2e;

            --text: #d5dde2;
            --text-muted: #8d9aa2;

            --card-border: rgba(255, 255, 255, 0.07);
            --card-shadow: rgba(0, 0, 0, 0.48);
            --card-highlight: rgba(220, 230, 235, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #202427;
            color: var(--text);

            font-family: "Source Sans 3", sans-serif;
            font-size: 16px;
            line-height: 1.4;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .content {
            width: min(900px, calc(100% - 10px));
            margin: 40px auto;
        }

        .card {
            position: relative;

            padding: 28px 15px;

            background: var(--card-bg);

            border: 1px solid var(--card-border);
            border-radius: 1px;

            box-shadow:
                0 0px 5px var(--card-shadow),
            inset 0 0 5px rgba(0, 0, 0, 0.3);
        }

        /* Die alte Idee der feinen Lichtkante – modern interpretiert */
        .card::before {
            content: "";
            position: absolute;

            top: 0;
            left: 8%;
            right: 8%;

            height: 1px;

            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(220, 230, 235, 0.025) 20%,
                var(--card-highlight) 50%,
                rgba(220, 230, 235, 0.025) 80%,
                transparent 100%
            );
        }

        .card h1 {
            margin: 0 0 14px;

            font-family: "Bebas Neue", sans-serif;
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 600;
            line-height: 1;

            letter-spacing: 0.025em;
            
            text-transform: uppercase;

            color: #dce4e8;
        }

        .card p {
            max-width: 70ch;

            margin: 0;

            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;

            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .content {
                width: min(100% - 10px, 900px);
                margin: 20px auto;
            }

            .card {
                padding: 22px 10px;
            }

            .card h1 {
                font-size: 32px;
            }

            .card p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="content">

        <article class="card">

            <h1>Die erste Ausfahrt</h1>

            <p>
                Dies ist ein Platzhaltertext für den späteren Hauptinhalt.
                Er dient zunächst ausschließlich dazu, Zeilenlänge,
                Zeilenabstand, Schriftgewicht und das Verhältnis zwischen
                Überschrift und Fließtext beurteilen zu können.
            </p>

        </article>

    </main>

</body>
</html>
